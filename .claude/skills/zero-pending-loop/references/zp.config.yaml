# zp.config.yaml — configurazione viva del loop zero-pendenze
# La skill legge SEMPRE da qui. Niente soglie, path o perimetri scritti nel prompt.

meta:
  project: heuresys-advanced
  plan: docs/superpowers/specs/2026-07-25-zero-pending-plan.md
  design: docs/superpowers/specs/2026-07-25-zero-pending-loop-design.md
  # GUARDIA: finche' e' false la skill NON esegue nessun cluster e si fermta con
  # outcome "blocked". La classificazione per raggio d'impatto e' la precondizione
  # di sicurezza dell'intero impianto: senza di essa nessuna corsia e' autorizzata.
  clusters_classified: true
  classified_at: 2026-07-25
  classified_against_sha: 7798df59

  # FRENO DI SICUREZZA — inserito dalla review CLI del 2026-07-25 (S1030).
  # Finche' e' false il driver rifiuta di aprire sessioni: l'impianto e' versionato e
  # ispezionabile, ma non parte. Non e' sfiducia nel lavoro, e' il risultato di due
  # revisioni ostili che hanno trovato difetti reali, alcuni gia' corretti e altri che
  # richiedono un ridisegno, non una patch:
  #
  #   CORRETTI in questa review — lock non atomico e cancellato dal driver sbagliato ·
  #   `kill` che non fermava il driver ma gli faceva mollare il lock · tetto di spesa
  #   inerte (stderr nel JSON + argv oltre 32k) · deploy di produzione non filtrato dalla
  #   classe di rischio (ora veto imposto da close-propagate.sh) · corsia che non arrivava
  #   alla sessione · «zero pendenze» dichiarabile con righe di piano non lette · CI
  #   «verde» con zero workflow valutati · API di produzione ferma vista come sana ·
  #   alert di sicurezza «accettati» per una parola trovata nella prosa del registro.
  #
  #   CHIUSI il 2026-07-26, tutti e sei, con prova eseguita:
  #   (a) la classe ora ha un PAVIMENTO imposto da cio' che il criterio di chiusura FA, non
  #       da come il lavoro e' descritto — e il pavimento vince sugli override manuali. I 7
  #       cluster che toccavano la produzione sono usciti dalla corsia non presidiata
  #       (Z-153 e Z-209 -> D, Z-070/Z-186/Z-048/Z-167/Z-108 -> C); in tutto 14 alzati,
  #       ZERO abbassati, coda safe da 89 a 78;
  #   (b) `class_c_preconditions` e' verificato da zp_state.precondizioni_classe_c(): dump
  #       piu' recente di 24h sull'archivio off-host + host di prova raggiungibile. Senza
  #       rete la classe C resta esclusa (159 candidati con rete, 78 senza): non verificate
  #       significa assenti;
  #   (c) il tipo di prova e' confrontato col comando (IMPRONTE) e `echo/printf/true` sono
  #       rifiutati con qualunque etichetta; output vuoto = prova rifiutata; encoding utf-8
  #       esplicito nei sottoprocessi, cosi' un apice tipografico non svuota piu' la prova;
  #   (d) il gate ragiona per LIVELLI (codice-isolato · sistema-api · sistema-ui · stato ·
  #       produzione · ripetibilita') invece che per tipo di strumento: `integration+e2e` e
  #       `psql+runtime` — che la Definition of Done impone — sono ammesse, e `staticcheck`
  #       non conta piu' come meta' prova. Coppie ammesse 26 su 36, era 31;
  #   (e) `zp_selftest` copre le quattro regressioni che non vedeva (effort, budget-ore,
  #       contatore fallimenti, marcatore di blocco su Enzo) con fixture sintetiche e atteso
  #       scritto a mano: iniettandole una per una, ora falliscono tutte e quattro, ognuna
  #       dal test giusto. 15 test, 0 falliti;
  #   (f) scritture di stato atomiche (tmp + rename) e letture che mettono da parte un file
  #       corrotto invece di degradare in silenzio; un id duplicato non sblocca piu' le
  #       dipendenze (chiuso solo se TUTTE le occorrenze lo sono); `--budget-ore` e' passato
  #       dal driver (tetto: budget.max_effort_hours_per_cluster).
  #
  # RESTA: il freno non si toglie da solo. E' una decisione di Enzo, non tecnica — e il
  # design e' ancora «BOZZA in attesa di approvazione». Restano inoltre i 4 test che
  # richiedono una sessione viva (bootstrap, freno a meta' lavoro, troncamento da budget,
  # frontiere della description): vanno fatti in una prima corsa presidiata.
  #
  # Referto completo: nell'entry di riconciliazione in docs/kb/COWORK_INBOX.md.
  autorizzato_non_presidiato: false

lanes:
  safe: [A, B]
  full: [A, B, C]
  # D ed E non appaiono in nessuna corsia: non e' una dimenticanza.
  # D richiede autorizzazione per lotto, E richiede un input di Enzo.

budget:
  # Il contesto residuo NON e' misurabile dall'interno di una sessione (nessun contatore
  # accessibile al modello, /context non invocabile in headless, hook senza dati di token,
  # compaction senza segnale). Quindi il consumo non si misura: si limita il lavoro.
  clusters_per_iteration: 1       # chiuso il cluster, si chiude la sessione e il driver riparte
  # Tetto di EFFORT per cluster in corsia non presidiata (S1030). `--budget-ore` esisteva
  # in zp_state ma non era passato da nessuno: la coda conteneva cluster fino a 18h contro
  # un budget di 12 USD per iterazione, e il troncamento a meta' cluster e' il modo di
  # fallire piu' costoso. Un lavoro piu' grande va spezzato nel piano o fatto presidiato.
  max_effort_hours_per_cluster: 4
  # VERIFICATO su claude 2.1.220 (`claude --help`): `--max-turns` NON esiste come flag CLI.
  # L'unico tetto quantitativo per invocazione e' `--max-budget-usd`. Il limite ai turni si
  # ottiene dalla clausola `or stop after N turns` dentro /goal, non da un flag.
  # Calibrazione 2026-07-25, primo dato reale disponibile: una sessione Cowork complessa
  # (135 min, +957/-239 righe, ~1200 righe cambiate) e' costata 73,62 USD. Un cluster tipico
  # vale ~1/10 di quel lavoro (~6-7 USD), piu' due prove eterogenee e tre revisori adversarial
  # che quella sessione non aveva. Da qui 12, non 8: meglio generoso per iterazione e severo
  # sul totale, perche' il troncamento a meta' cluster e' il modo di fallire piu' costoso.
  # RESTA UNA STIMA finche' non gira il primo cluster vero: `zp avvia -Iterazioni 1` la valida.
  max_budget_usd_per_iteration: 12  # -> claude -p --max-budget-usd
  goal_turn_bound: 25               # -> clausola "or stop after N turns" nella riga /goal
  max_iterations_default: 12        # tetto del driver
  hard_stop_usd_total: 120          # tetto globale cumulato, misurato dal driver fra le
                                    # iterazioni leggendo total_cost_usd da --output-format json.
                                    # E' il tetto che vincola per primo: 120/12 = 10 iterazioni,
                                    # meno delle 12 nominali. Voluto: il totale e' la guardia vera.

runtime:
  # VERIFICATO: `bash` nel PATH di Windows risolve allo stub WSL
  # (C:\Users\...\WindowsApps\bash.exe) che NON ha distribuzioni installate.
  # Il driver va invocato con il path assoluto di Git Bash, mai con `bash` nudo.
  bash: 'C:\Git\bin\bash.exe'
  claude: 'C:\Users\enzospenuso\.local\bin\claude.exe'

push:
  # Deroga consapevole alla regola di progetto "una sessione nuova torna a chiedere".
  # Azzerare `enabled` revoca l'autorizzazione senza toccare altro.
  enabled: true
  remote: origin
  branch: main
  allow_force: false
  require_green_gates: true
  require_green_lint: true
  rebase_before_push: true
  relint_after_rebase: true

gates:
  # area (glob) -> comandi. Un'area toccata e non mappata qui e' un errore bloccante.
  "apps/api/**":
    - pnpm typecheck
    - pnpm lint
    - "vitest: file toccati + moduli dipendenti"
    - "integration su DB reale (tunnel :5433)"
  "apps/web/**":
    - pnpm typecheck
    - pnpm lint
    - pnpm i18n:check
    - "playwright: spec pertinenti (test:e2e:prod:node22 se Node >= 23 — D-36)"
  "packages/shared/**":
    - pnpm typecheck
    - "rebuild consumer: api, web, showcase"
  "db/migrations/**":
    - "pnpm db:migrate x2 con diff pg_dump vuoto"
    - pnpm db:validate
  "db/seeds/**":
    - "seed idempotente x2"
    - pnpm db:validate
  "scripts/**":
    - "lint shell + dry-run del percorso modificato"
  "deploy/**":
    - "lint shell + dry-run del percorso modificato"
  "docs/kb/**":
    - python docs/kb/tools/handoff_lint.py

class_c_preconditions:
  # Dal S1030 queste righe sono VERIFICATE da zp_state.precondizioni_classe_c(), non piu'
  # solo dichiarate: un cluster di classe C non e' candidabile finche' non sono soddisfatte.
  verified_dump_max_age_hours: 24
  rehearsal_host: linux-pc          # gemello prod con DB clone locale
  archive_dir: ~/heuresys-backups/prod   # dove pull-prod-backups.sh deposita i dump
  require_idempotent_twice: true
  require_empty_pgdump_diff: true

adversarial:
  reviewers: 3
  lenses: [correttezza, isolamento-e-sicurezza, riproducibilita]
  majority_to_dismiss: 2
  # Un rilievo di severita' alta su isolamento tenant o segreti vale anche da solo:
  # il costo dell'errore non e' simmetrico.
  single_vote_binding_severities: [alta]
  single_vote_binding_lenses: [isolamento-e-sicurezza]
  max_correction_rounds: 2

hosts:
  vm: oracle-vm-default
  twin: linux-pc
  # Il Mac e' RITIRATO dai processi automatici (S1007): non e' un target.

paths:
  runtime_dir: .zp
  progress_file: .zp/PROGRESS.md      # committato a ogni chiusura (vista per il telefono)
  supervised_batch: .zp/lotto-presidiato.md
  blocked_tray: .zp/vassoio.md
  authorizations: .zp/autorizzazioni.txt   # scritto da `zp lotto ok N`, letto dalla skill
  runs: .zp/runs.ndjson
  stop_switch: .zp/STOP
  cursor: .zp/cursor.json
  last_outcome: .zp/last-outcome.json
  lock: .zp/driver.lock
  lock_stale_after_hours: 2

interrupt_resume:
  # Vedi references/driver.md. Il principio: nessun modo di interrompere perde stato,
  # perche' lo stato e' su file e ogni chiusura pulita fa push su origin main.
  resume_stale_after_hours: 24      # oltre questa soglia il rilancio entra da `bootstrap`,
                                    # non da `resume`: il piano puo' essersi mosso
  window: null                      # es. "22:00-07:00". A fine finestra: chiusura pulita, non
                                    # troncamento. La ripartenza la fa l'attivita' pianificata
  refuse_on_dirty_worktree: true    # qualcuno sta lavorando in quel repo: non partire
  refuse_on_unpushed_foreign: true  # commit locali non tuoi in volo: non partire
  max_failures_per_cluster: 2       # al terzo tentativo nella stessa direzione si cambia oggetto

