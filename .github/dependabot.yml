# Dependabot configuration for Heuresys Advanced
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Tier 1 baseline:
#   - Weekly checks for npm (root + workspaces) and GitHub Actions
#   - Group minor + patch updates per ecosystem to reduce PR noise
#   - Manual review required for major bumps (each in its own PR)

version: 2
updates:
  # Root pnpm monorepo: catches all workspaces (apps/* + packages/*)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node must track the MAJOR of the runtime, not the latest published
      # major. The runtime is pinned to Node 22 (package.json engines ">=22.0.0",
      # .nvmrc 22, nvm "use 22" on VM + linux-pc). Typing against @types/node 26
      # would surface APIs that do not exist at runtime — a silent footgun.
      # Minor/patch of the 22.x line stay in scope via the group above.
      # Revisit when the runtime itself moves to the next LTS (S1030, cluster Z-004).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # fastify >= 5.12 ha RIMOSSO la forma numerica di `trustProxy`, che questa
      # piattaforma usa in produzione (TRUST_PROXY=1, D-28). In lib/request.js:
      #   if (typeof tp === 'number') { return function () { return false } }
      # Non e' deprecata: non si fida piu' di nulla. Preso il bump, `req.ip`
      # diventerebbe l'indirizzo del proxy e il rate limiting per IP finirebbe in
      # un secchio solo per tutte le richieste — senza errore, senza log, senza
      # test rosso. Le PR #76 e #75 sono state chiuse per questo.
      #
      # Questo ignore esiste perche' chiuderle NON BASTA: al giro dopo Dependabot
      # ha rimesso lo stesso bump DENTRO il gruppo minor-and-patch (PR #74, poi
      # #78), dove passa molto piu' facilmente inosservato. Senza questa riga,
      # ogni settimana qualcuno deve accorgersene di nuovo.
      #
      # ⚠ SI TOGLIE quando la voce #242 e' chiusa (migrazione di `trustProxy`
      # alla forma per indirizzo), non prima.
      - dependency-name: "fastify"
        versions: [">=5.12"]
    labels:
      - "dependencies"
      - "area/deps"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions workflows (when added)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "area/ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
