name: Build (web)

# S935 phase F — CI gate #5: Next.js 15 production build for apps/web.
# Catches Next/React peer-dep drift early (relevant post-S935 phase C
# pnpm.overrides additions for react/react-dom).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    # Security (D-08): self-hosted runner (off-prod twin on the LAN) — a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (runner
    # churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, off-prod]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      # Next.js build cache — standard key pattern: lockfile + web source hash, so
      # an unchanged source set restores a warm .next/cache (faster incremental
      # builds); the lockfile-only restore-key gives a partial hit on source churn.
      - name: Cache Next.js build (apps/web/.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build @heuresys/shared (hard prerequisite — web consumes dist/*.js, D-58)
        run: pnpm --filter @heuresys/shared run build  # must succeed: exports default -> ./dist/*.js; a stale/missing dist reintroduces the Turbopack barrel-resolution failure

      - name: Build apps/web
        env:
          # Build-time public env vars (no secrets).
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @heuresys/web build

      - name: Verify .next output
        run: |
          test -d apps/web/.next || { echo "build output missing"; exit 1; }
          test -f apps/web/.next/build-manifest.json || { echo "build manifest missing"; exit 1; }
