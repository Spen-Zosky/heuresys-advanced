name: Copertura dell'agente (ogni scrittura ha la sua classe)

# Piano Heuresys AI-driven, voce F1b (ADR-0063, principio P1): ogni funzione nuova nasce con la
# sua voce per l'agente. Una rotta POST, PUT, PATCH o DELETE senza riga in
# docs/kb/agent-classi-scritture.json rende rossa la PR. Le rotte si leggono dal codice, non
# dall'atlante, che si rigenera solo dopo l'unione.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/src/modules/**"
      - "apps/api/src/app.ts"
      - "docs/kb/agent-classi-scritture.json"
      - "docs/kb/agent-perimetri.json"
      - "docs/kb/tools/check_copertura_agente.py"
      - "docs/kb/tools/build_atlas.py"
      - "docs/kb/tools/build_agent_operations.py"
      - ".github/workflows/copertura-agente.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/modules/**"
      - "apps/api/src/app.ts"
      - "docs/kb/agent-classi-scritture.json"
      - "docs/kb/agent-perimetri.json"
      - "docs/kb/tools/check_copertura_agente.py"
      - "docs/kb/tools/build_atlas.py"
      - "docs/kb/tools/build_agent_operations.py"
      - ".github/workflows/copertura-agente.yml"
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: copertura-agente-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconda passata = doppione? Se l'albero e' gia' verde nella PR, su main il job si salta.
  tree:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tree-gia-verificato.yml
    with:
      workflow-file: copertura-agente.yml
  copertura-agente:
    needs: tree
    # Come state-lint (D-08): il runner sta sull'host di produzione, niente PR da fork.
    if: ${{ !cancelled() && needs.tree.outputs.skip != 'true' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major')) }}
    runs-on: [self-hosted, leggero]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Il controllo sa diventare rosso
        run: python3 docs/kb/tools/check_copertura_agente.py --selftest

      - name: Ogni scrittura ha la sua classe o un'esclusione scritta (F1b)
        run: python3 docs/kb/tools/check_copertura_agente.py
