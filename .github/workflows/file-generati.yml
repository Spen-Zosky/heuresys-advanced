name: File generati allineati

# Piano interfacce L10. Due file generati che il codice usa e che nessuno scrive a mano:
# le pagine su cui si monta il pannello dell'agente (A-8) e i moduli con le loro tabelle per
# l'origine del dato (A-14). Se la fonte cambia e il file no, il cancello è rosso. Sta in un
# workflow suo e non in state-lint: le sue fonti (le pagine del portale, l'atlante) cambiano
# spesso, e non devono trascinare con sé il controllo dei file di stato.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/src/app/**"
      - "apps/web/src/lib/agente/pagine-idonee.generated.ts"
      - "apps/api/src/lib/origine/moduli.generated.ts"
      - "docs/kb/atlas/**"
      - "docs/kb/tools/check_idoneita_agente.py"
      - "docs/kb/tools/build_origine_moduli.py"
      - ".github/workflows/file-generati.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/app/**"
      - "apps/web/src/lib/agente/pagine-idonee.generated.ts"
      - "apps/api/src/lib/origine/moduli.generated.ts"
      - "docs/kb/atlas/**"
      - "docs/kb/tools/check_idoneita_agente.py"
      - "docs/kb/tools/build_origine_moduli.py"
      - ".github/workflows/file-generati.yml"
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: file-generati-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconda passata = doppione? Se l'albero e' gia' verde nella PR, su main i job si saltano
  # (scripts/ci/tree-gia-verificato.sh). Ogni dubbio: la CI gira.
  tree:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tree-gia-verificato.yml
    with:
      workflow-file: file-generati.yml
  file-generati:
    needs: tree
    # Come state-lint (D-08): il runner sta sull'host di produzione, niente PR da fork.
    if: ${{ !cancelled() && needs.tree.outputs.skip != 'true' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major')) }}
    runs-on: [self-hosted, leggero]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # build_origine_moduli.py importa yaml: il Debian dello Z420 non ha python3-yaml. Se manca, un
      # ambiente della corsa con PyYAML fissato (niente pacchetti di sistema toccati).
      - name: PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q "pyyaml==6.0.2"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: Pagine idonee al pannello dell'agente (A-8)
        run: python3 docs/kb/tools/check_idoneita_agente.py --check-ts apps/web/src/lib/agente/pagine-idonee.generated.ts

      - name: Moduli e tabelle per l'origine del dato (A-14)
        run: python3 docs/kb/tools/build_origine_moduli.py --check
