name: i18n parity (it/en)

# S935 phase F — CI gate #3: i18n parity check for apps/web.
# Verifies it.json and en.json have the same keys (no orphan translations,
# no missing translations). The check itself is <5s, but the job also does
# checkout + `pnpm install`; on the SINGLE self-hosted runner a big push (F5
# fired 6 workflows at once) serializes those under contention. timeout-minutes
# is sized for that setup cost, not the check — aligned with the other
# install+check jobs (lint/shell-tests/state-lint = 5), which held on the same
# push where a 3-min cap cancelled this one (S1012).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/src/locales/**"
      - "apps/web/scripts/check-i18n-parity.ts"
      - ".github/workflows/i18n-parity.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/locales/**"
  workflow_dispatch: {}

concurrency:
  group: i18n-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-parity:
    # Security (D-08): the self-hosted runner sits on the PROD host, so a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (single
    # runner churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, oci-vm]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check i18n parity
        run: pnpm i18n:check
