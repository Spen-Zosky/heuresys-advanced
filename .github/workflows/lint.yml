name: Lint (all workspaces)

# S935 phase F — CI gate #2: ESLint flat config 9.x across all workspaces.
# Post-CODE-NEW-2 fix (S933 pre-flight) apps/web is 0 errors; we enforce that.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "cowork_reserved/**"
      - "cowork_code_exchange/**"
      - ".handoff/**"
      - "qa_artifacts/**"
      - "sessioni/**"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Security (D-08): the self-hosted runner sits on the PROD host, so a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (single
    # runner churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, oci-vm]
    # 10min: the D-08 F3 resource slice (CPUQuota=300%) + a fresh-lockfile
    # install push the web eslint past the old 5min budget (S1023: two runs
    # killed at 5:12 reported as 'cancelled').
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint — @heuresys/shared
        run: pnpm --filter @heuresys/shared run lint

      - name: Lint — @heuresys/api
        run: pnpm --filter @heuresys/api run lint

      - name: Lint — @heuresys/web
        run: pnpm --filter @heuresys/web run lint

      # apps/showcase NON ha uno script `lint`: fino a S1029 questo step invocava uno
      # script inesistente e passava sempre verde — un gate che non gatea nulla è
      # peggio di nessun gate, perché produce fiducia infondata. Reso esplicito con
      # --if-present in attesa del cluster che gli dà un ESLint vero (W2), così lo
      # stato "non lintato" è dichiarato invece che mascherato.
      - name: Lint — @heuresys/showcase (nessun ESLint ancora — vedi W2)
        run: pnpm --filter @heuresys/showcase run --if-present lint

      # agent-gateway era fuori da ogni workflow: i suoi 5 file di test non giravano
      # mai in CI. Il suo `lint` è oggi `tsc --noEmit` (nessun ESLint) — anch'esso in
      # carico al cluster W2; qui almeno il typecheck e i test entrano nella pipeline.
      - name: Lint — @heuresys/agent-gateway
        run: pnpm --filter @heuresys/agent-gateway run lint

      - name: Test — @heuresys/agent-gateway (vitest, nessun DB)
        run: pnpm --filter @heuresys/agent-gateway run test
