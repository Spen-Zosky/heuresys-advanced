name: Lint (all workspaces)

# S935 phase F — CI gate #2: ESLint flat config 9.x across all workspaces.
# Post-CODE-NEW-2 fix (S933 pre-flight) apps/web is 0 errors; we enforce that.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "cowork_reserved/**"
      - "cowork_code_exchange/**"
      - ".handoff/**"
      - "qa_artifacts/**"
      - "sessioni/**"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Security (D-08): the self-hosted runner sits on the PROD host, so a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (single
    # runner churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, oci-vm]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint — @heuresys/shared
        run: pnpm --filter @heuresys/shared run lint

      - name: Lint — @heuresys/api
        run: pnpm --filter @heuresys/api run lint

      - name: Lint — @heuresys/web
        run: pnpm --filter @heuresys/web run lint

      - name: Lint — @heuresys/showcase
        run: pnpm --filter @heuresys/showcase run lint
