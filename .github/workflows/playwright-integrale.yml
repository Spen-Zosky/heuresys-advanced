name: Playwright integrale (suite E2E completa, a fasi)

# #219 F5e — S1089. La corsa INTEGRALE della suite, non lo smoke.
#
# ── PERCHÉ UN WORKFLOW SEPARATO, E NON UNA RIGA CAMBIATA IN playwright-smoke ──
# Lo smoke è il gate #6 su ogni push: gira in pochi minuti e deve restare tale.
# La corsa integrale dura ~35 minuti misurati (13,8 + 6,6 + ~7 + ~7) e ha
# precondizioni d'ambiente proprie. Innestarla lì dentro legherebbe ogni push a
# una corsa lunga, e al primo rosso non attribuibile la si spegnerebbe — cioè si
# tornerebbe al punto di partenza.
#
# Resta quindi **solo manuale** (`workflow_dispatch`) finché non sarà verde in CI
# almeno una volta. Renderlo automatico è una decisione successiva, da prendere
# sui numeri di quel giro.
#
# ── LA PREPARAZIONE È QUELLA DELLO SMOKE, RIUSATA E NON REINVENTATA ──────────
# ⚠ La prima stesura (S1089) saltava dall'avvio dell'API senza installare nulla:
#   `tsx: not found`, `node_modules missing`, job rosso in 90 secondi. I passi
#   qui sotto — pnpm, Node, install, browser, migrazioni, seed delle persone —
#   sono gli stessi di `playwright-smoke.yml`, dove sono già collaudati, e ognuno
#   porta la ragione per cui esiste: riscriverli a memoria avrebbe rifatto gli
#   stessi errori che quel file ha già pagato.
#
# ── COSA È GIÀ VERO, MISURATO (2026-09-06) ───────────────────────────────────
# ⚠ Una convinzione precedente era SBAGLIATA e va corretta qui, perché ha quasi
#   fatto scartare questa strada: si diceva che `heuresys_ci` «non ha i dati su
#   cui la suite è tarata». Misurato:
#
#     heuresys_advanced   164 utenti · 160 contratti · 14.031 competenze · 2 tenant
#     heuresys_ci         161 utenti · 160 contratti · 14.031 competenze · 2 tenant
#
#   La differenza sono **tre utenze di servizio**, non il dataset.
#
# ── L'OSTACOLO CHE QUESTO WORKFLOW MISURA INVECE DI PRESUMERE ────────────────
# `verifyCsrf` rifiuta con **403** ogni scrittura fatta dal browser se l'origine
# non è fra quelle dichiarate in `ADMIN_ORIGIN` — stesso codice di un permesso
# negato, quindi indistinguibile nei referti. È il guasto che in S1088 ha
# prodotto 42 rossi attribuiti per tre sessioni ai permessi. Sul runner
# l'origine è `http://localhost:3187`, dichiarata in un drop-in systemd; il
# preflight la **interroga sull'API viva** e ferma la corsa PRIMA di spendere 35
# minuti se non combacia.

on:
  workflow_dispatch: {}

concurrency:
  group: playwright-integrale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright-integrale:
    runs-on: [self-hosted, off-prod]
    # ~35 minuti misurati + build, avvii e margine. Il tetto di 30 dello smoke
    # sarebbe stato superato dalla sola fase 1 in una giornata carica.
    timeout-minutes: 75
    env:
      # D-08: la CI non tocca MAI la produzione.
      POSTGRES_DB: heuresys_ci
      POSTGRES_DATABASE: heuresys_ci
      NODE_ENV: test
      LOG_LEVEL: warn
      PLAYWRIGHT_WEB_PORT: "3187"
      # ⚠ DOVE STA L'API, DICHIARATO — e il preflight ha preteso proprio questo.
      # In locale la porta si deriva dal `.env` del repo; in CI quel file NON
      # ESISTE (il checkout è pulito) e nessuna delle due variabili era nel job:
      # il preflight si è fermato in due secondi con «porta dell'API NON
      # MISURABILE — non tiro a indovinare una porta», che è il comportamento
      # giusto. Indovinare avrebbe prodotto una corsa intera di rossi non
      # attribuibili.
      # `PORT` è quella su cui il passo «Avvia l'API» la fa nascere;
      # `NEXT_PUBLIC_API_PROXY_BASE_URL` è la destinazione che Next COMPILA nei
      # rewrites al momento del build — va quindi dichiarata a livello di job,
      # prima che la config Playwright costruisca il web (S1088: un manifest
      # compilato verso la porta sbagliata è costato tre sessioni di diagnosi).
      PORT: "3001"
      NEXT_PUBLIC_API_PROXY_BASE_URL: "http://localhost:3001"
      # ⚠ L'ORIGINE AMMESSA SI DICHIARA QUI, NON SUL RUNNER — misurato 2026-09-06.
      # Il terzo giro (34040733480) è morto sul preflight con «l'API non ammette
      # l'origine http://localhost:3187». Il drop-in systemd installato in S1089
      # dichiarava il valore giusto, e `systemctl show -p Environment` lo
      # confermava — ma il processo VIVO del runner ne aveva un altro:
      #   systemctl show -p Environment  → ADMIN_ORIGIN=http://localhost:3187
      #   /proc/<MainPID>/environ        → ADMIN_ORIGIN=http://localhost:3000
      # Perché: fra i drop-in del servizio, `override.conf` ordina DOPO
      # `e2e-origin.conf` e porta `EnvironmentFile=/etc/heuresys-runner.env`.
      # systemd applica `Environment=` e `EnvironmentFile=` nell'ordine in cui
      # compaiono, e l'ultimo vince: il file rimetteva la 3000. La convinzione
      # scritta nel drop-in — «un drop-in è applicato dopo gli EnvironmentFile» —
      # era falsa, e `systemctl show` non poteva smentirla perché NON mostra il
      # contenuto degli EnvironmentFile. Solo `/proc/<pid>/environ` lo mostra.
      # Dichiararla nel job la mette dove il valore è VERSIONATO, visibile nel
      # log del passo, e non richiede `sudo` sul gemello: l'ambiente del job
      # sovrascrive quello ereditato dal servizio, qualunque cosa esso dica.
      ADMIN_ORIGIN: "http://localhost:3187"
      # ⚠ IL LIMITATORE DEI LOGIN — quinto giro (34043971361), e la pagina lo ha
      # detto da sé nello scatto del fallimento: «Troppi tentativi. Riprova tra
      # qualche minuto.» `/v1/auth/login` accetta `AUTH_LOGIN_RATELIMIT_MAX`
      # tentativi per IP ogni 5 minuti, e il default è la policy di produzione:
      # **10**. In locale il `.env` del repo lo alza; in CI quel file non esiste,
      # quindi valeva 10 — e la sola preparazione ne consuma già di più: sonda del
      # preflight + sei personaggi + i ritentativi. Cadeva sempre il SESTO,
      # `custodian`, che è l'ultimo della fila: non un guasto della custodia, un
      # posto in coda. E siccome quel caso apre un blocco `serial`, si è portato
      # dietro 350 test «non eseguiti» — che non è «passati».
      # ⚠ Ed è l'UNICA variabile che `playwright-smoke.yml` dichiarava e questo no
      # (confrontati i due blocchi `env:` uno contro l'altro, non a memoria): la
      # cifra è la sua, già collaudata in CI, non un numero inventato qui.
      AUTH_LOGIN_RATELIMIT_MAX: "200"
      # ⚠ L'ORIGINE DELLA CERIMONIA PASSKEY — sesto giro (34050172629), 2 rossi.
      # `WEBAUTHN_ORIGINS` vale `http://localhost:3000` per default e in CI il web
      # nasce sulla 3187: la registrazione di una passkey rispondeva **400** invece
      # di 200 (`login-mfa-enrollment.spec.ts`, `webauthn.spec.ts`). È la STESSA
      # specie di ADMIN_ORIGIN — un elenco chiuso di origini ammesse che nessuno
      # aveva aggiornato per la porta della CI — e come quella si dichiara qui.
      # `WEBAUTHN_RP_ID` resta il default `localhost`: l'RP ID è il dominio senza
      # schema né porta, e il dominio è proprio quello.
      WEBAUTHN_ORIGINS: "http://localhost:3187"
      # ⚠ LA RICERCA SEMANTICA È DICHIARATA SPENTA QUI, e non è un ripiego tecnico:
      # `MATCHING_FREETEXT_ENABLED` è spenta per default e ogni ricerca è **una
      # chiamata a pagamento** al fornitore di embedding (due per corsa integrale).
      # Accenderla in CI è una decisione di costo, non mia: resta fra le domande
      # aperte in `.handoff/STATE.md`. Finché è spenta, i due casi di
      # `matching-freetext.spec.ts` si dichiarano NON ESEGUITI con la ragione
      # scritta — che è la forma onesta — invece di fallire come se il prodotto
      # fosse rotto. Per accenderli: togliere questa riga e dare `VOYAGE_API_KEY`
      # e `MATCHING_FREETEXT_ENABLED=true` all'API del runner.
      E2E_RICERCA_SEMANTICA: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve Playwright version
        id: pw-version
        run: |
          PW_VERSION=$(pnpm --filter @heuresys/web exec playwright --version | awk '{print $2}')
          echo "version=${PW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers (~/.cache/ms-playwright)
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browser binaries (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @heuresys/web exec playwright install chromium

      - name: Cache Next.js build (apps/web/.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      # heuresys_ci è un clone di PROD congelato al provisioning (D-08). Portarlo
      # a HEAD è idempotente e provato a due passate.
      - name: Apply migrations (idempotent, brings the clone to HEAD)
        run: |
          printf 'POSTGRES_HOST=%s\nPOSTGRES_PORT=%s\nPOSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\n' \
            "${POSTGRES_HOST:-localhost}" "${POSTGRES_PORT:-5432}" "$POSTGRES_DB" "$POSTGRES_USER" "$POSTGRES_PASSWORD" > /tmp/ci-migrate-integrale.env
          bash db/scripts/migrate.sh /tmp/ci-migrate-integrale.env
          rm -f /tmp/ci-migrate-integrale.env

      # Le migrazioni portano i RUOLI, non l'autenticazione delle persone: una
      # persona nata dopo il clone non potrebbe entrare (S1027).
      - name: Seed test personas (idempotent, login-only)
        run: pnpm db:seed-test-admin

      - name: Ricostruisci il fascicolo di RTL (dato creato da script, non da migrazione)
        working-directory: apps/api
        # ⚠ Sesto giro (34050172629), 1 rosso: `tenant-blueprints.spec.ts` cercava la
        # riga `RTL-BANK-CONFIG` e ne trovava zero. Misurato sui due database:
        #   heuresys_advanced -> 1     heuresys_ci -> 0
        # Non è un guasto: quel fascicolo lo crea uno SCRIPT
        # (`db/scripts/ricostruisci-fascicolo-rtl.ts`), non una migrazione, e la
        # catena applicata al clone della CI non lo porta con sé. È la trappola già
        # registrata — «tabella creata da migration ma popolata da script = vuota su
        # CI» — e si cura come il seed delle persone: eseguendo lo script.
        # È idempotente e si verifica da sé (esce ≠ 0 se anche una sola motivazione
        # differisce di un carattere), quindi qui fa due mestieri in uno.
        run: pnpm exec tsx ../../db/scripts/ricostruisci-fascicolo-rtl.ts

      - name: Avvia l'API (nessuna config Playwright lo fa)
        working-directory: apps/api
        # ⚠ Né `playwright.config` né `playwright.prod.config` avviano `apps/api`:
        # avviano solo il web. Senza questo passo ogni login fallisce, i sei setup
        # diventano rossi e TUTTO il resto risulta «skipped» — il referto che in
        # S1080 fu letto come «le utenze non esistono più».
        # `setsid` perché un figlio con `&` prende SIGHUP fra un passo e l'altro.
        run: |
          if curl -sf http://localhost:3001/readyz > /dev/null 2>&1; then
            echo "porta 3001 gia' occupata da un processo estraneo:"; ss -ltnp | grep ":3001" || true; exit 1
          fi
          setsid bash -c 'pnpm dev > /tmp/api-integrale.log 2>&1' &
          for i in $(seq 1 90); do
            curl -sf http://localhost:3001/readyz > /dev/null && { echo "API su"; break; }
            sleep 1
          done
          curl -s http://localhost:3001/readyz | grep -q '"database"' || {
            echo "cio' che risponde su :3001 NON e' l'API heuresys-advanced"; tail -50 /tmp/api-integrale.log; exit 1; }

      - name: Preflight — l'ambiente è quello che la suite presume?
        working-directory: apps/web
        # ⚠ QUESTO PASSO VALE L'INTERO WORKFLOW. Senza, un'origine non ammessa o
        # un bundle vecchio producono decine di rossi che NON sono guasti, e il
        # referto non lo dice: è precisamente ciò che ha fatto perdere tre
        # sessioni. Qui la corsa si ferma in pochi secondi nominando la causa.
        run: node scripts/e2e-blocchi.mjs --solo-preflight

      - name: Build del web (la corsa integrale gira su `next start`, non su `next dev`)
        working-directory: apps/web
        # ⚠ IL PASSO CHE MANCAVA — quarto giro (34042451236), tutte e quattro le
        # fasi rosse in pochi secondi con lo stesso messaggio:
        #   «Could not find a production build in the '.next' directory»
        # Non era un guasto della suite: 0 test eseguiti su 447 dichiarati.
        # `playwright.prod.config.ts` avvia il web con `next start`, che pretende
        # un build già emesso. In locale non si vede perché lo script di comodo
        # li tiene insieme:
        #   "test:e2e:prod": "next build && node scripts/e2e-blocchi.mjs"
        # e il workflow chiamava solo la SECONDA metà. Lo smoke non ha mai avuto
        # questo problema perché usa `playwright.config.ts`, cioè `next dev`.
        # ⚠ Va DOPO il preflight, non prima: il preflight costa due secondi e il
        # build alcuni minuti — fermarsi sull'ambiente sbagliato deve restare la
        # cosa più economica che questo workflow sa fare.
        # `NEXT_PUBLIC_API_PROXY_BASE_URL` è dichiarata nell'`env:` del job
        # proprio perché Next la COMPILA qui dentro, nei rewrites.
        run: pnpm exec next build

      - name: Corsa integrale a fasi
        working-directory: apps/web
        # Fasi come INVOCAZIONI SEPARATE di Playwright: un rosso in una fase non
        # può impedire alle altre di girare (in Playwright un progetto la cui
        # dipendenza fallisce viene SALTATO, e «non ho eseguito» non è
        # «passato»). Lo script conta gli eseguiti e li confronta col totale
        # dichiarato da --list: se non torna esce rosso anche a fasi tutte verdi.
        run: node scripts/e2e-blocchi.mjs

      - name: Triage per firma (anche quando è verde)
        working-directory: apps/web
        if: always()
        continue-on-error: true
        run: node scripts/e2e-triage.mjs --dettaglio 1

      - name: Referti per fase
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-referti
          path: |
            apps/web/.e2e-fase-*.json
            apps/web/playwright-report/
          retention-days: 7
