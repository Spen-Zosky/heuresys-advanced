name: Playwright smoke (web E2E)

# S935 phase F — CI gate #6: Playwright E2E smoke suite on apps/web.
# Requires: API dev server running on :3001 + web dev server on :3000 +
# DB seeded with test admin + 5 personas. The self-hosted runner boots these
# via the smoke-setup script (see docs/ci/self-hosted-runners-setup.md §5).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/shared/**"
      - "playwright.config.ts"
      - "tests/**"
      - ".github/workflows/playwright-smoke.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright-smoke:
    # Skip on Dependabot defer-major PRs: they auto-rebase and would churn the single self-hosted runner. Push events have no PR labels → always run. See DEBT_REGISTER D-09.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, oci-vm]
    timeout-minutes: 30
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      # OCI VM runner already runs Grafana on :3000 (docker-proxy). :3100 was
      # the first relocation, but on 2026-06-11 an unrelated next-server on the
      # VM grabbed it and the old `curl -sf` health check happily passed against
      # the WRONG app (S984 root-cause of the all-personas login-submit
      # timeout). Use a less obvious port AND guard the boot step below with a
      # pre-bind check + served-app identity check; playwright.config reads this.
      PLAYWRIGHT_WEB_PORT: "3187"
      # S983 WS-E: under the live mandatory-MFA policy every persona login is
      # TWO requests (password + TOTP step-2) - the production default per-IP
      # limit (10/5min) would starve the 5-persona setup + retries. CI-only;
      # PROD keeps its own value.
      AUTH_LOGIN_RATELIMIT_MAX: "200"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright browsers
        run: pnpm --filter @heuresys/web exec playwright install --with-deps chromium

      - name: Verify test admin + personas seeded
        run: |
          psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DATABASE \
            -c "SELECT user_email FROM sys.sys_users WHERE user_email IN ('admin@heuresys.com','federica.marchetti@rtl-bank.org','paolo.caputo@rtl-bank.org','tommaso.fiore@rtl-bank.org','antonio.parisi@rtl-bank.org')" \
            -tA | sort > /tmp/seeded.txt
          test $(wc -l < /tmp/seeded.txt) -eq 5 || \
            { echo "test personas not seeded — run pnpm db:seed-test-admin first"; exit 1; }

      - name: Boot API server (background)
        working-directory: apps/api
        run: |
          # Guard: the runner VM is a multi-app host (see deploy/README.md
          # "Mappa porte VM") — if anything already answers on :3001 it is a
          # foreign process; fail loud instead of health-checking the wrong app
          # (S984 lesson, same class as the :3100 web collision).
          if curl -sf http://localhost:3001/readyz > /dev/null 2>&1 || curl -sf http://localhost:3001 > /dev/null 2>&1; then
            echo "port 3001 already in use by a foreign process:"
            ss -ltnp | grep ":3001" || true
            exit 1
          fi
          # setsid detaches into a new session so the server survives this
          # step's shell exit (a bare `&` child gets SIGHUP'd between steps →
          # the next step finds nothing listening).
          setsid bash -c 'pnpm dev > /tmp/api.log 2>&1' &
          for i in $(seq 1 90); do
            curl -sf http://localhost:3001/readyz > /dev/null && { echo "API up"; break; }
            sleep 1
          done
          curl -sf http://localhost:3001/readyz > /dev/null || { echo "API failed to start"; tail -50 /tmp/api.log; exit 1; }
          # Identity check: our readyz reports the DB probe.
          curl -s http://localhost:3001/readyz | grep -q '"database"' || \
            { echo "served app on :3001 is NOT the heuresys-advanced API"; tail -50 /tmp/api.log; exit 1; }

      - name: Boot web server (background)
        working-directory: apps/web
        run: |
          # Guard: if ANYTHING already answers on the port, it is a foreign
          # process (we have not started ours yet) — fail loud instead of
          # letting the health check below pass against the wrong app (S984).
          if curl -sf "http://localhost:${PLAYWRIGHT_WEB_PORT}" > /dev/null 2>&1; then
            echo "port ${PLAYWRIGHT_WEB_PORT} already in use by a foreign process:"
            ss -ltnp | grep ":${PLAYWRIGHT_WEB_PORT}" || true
            exit 1
          fi
          pnpm build
          # Invoke `next start` directly: the package `start` script hardcodes
          # `-p 3000`, which ignores PORT and collides with Grafana. setsid so
          # the server survives into the Playwright step.
          setsid bash -c "pnpm exec next start -p ${PLAYWRIGHT_WEB_PORT} > /tmp/web.log 2>&1" &
          for i in $(seq 1 90); do
            curl -sf "http://localhost:${PLAYWRIGHT_WEB_PORT}" > /dev/null && { echo "web up"; break; }
            sleep 1
          done
          curl -sf "http://localhost:${PLAYWRIGHT_WEB_PORT}" > /dev/null || { echo "web failed to start"; tail -50 /tmp/web.log; exit 1; }
          # Identity check: the served app must be OURS (the login page HTML
          # carries the heuresys brand marker; a foreign app will not).
          curl -s "http://localhost:${PLAYWRIGHT_WEB_PORT}/login" | grep -qi heuresys || \
            { echo "served app on :${PLAYWRIGHT_WEB_PORT} is NOT heuresys-advanced web"; tail -50 /tmp/web.log; exit 1; }

      - name: Run Playwright smoke suite
        working-directory: apps/web
        # The canonical smoke is the 5-persona spec (login + role-gated nav +
        # 2 extra pages per persona). There is no `@smoke` title tag in the
        # suite — the prior `--grep "@smoke"` matched zero tests → "No tests
        # found" → exit 1. Target the file directly; the `setup` project
        # (auth.setup.ts → storageState) still runs as a project dependency.
        run: pnpm exec playwright test smoke-5-personas.spec.ts --reporter=list,html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Cleanup background processes
        if: always()
        run: |
          [ -n "$API_PID" ] && kill $API_PID 2>/dev/null || true
          [ -n "$WEB_PID" ] && kill $WEB_PID 2>/dev/null || true
