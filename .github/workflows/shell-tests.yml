name: Shell tests (deploy/alignment scripts)

# D-19 — regression gate for scripts/ + db/scripts/ shell automation:
# bash -n on every script, shellcheck severity=error (installed on the runner),
# and fixture tests for the env-key-merge core + align-clones auto-deploy regex.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "db/scripts/**"
      - ".github/workflows/shell-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "db/scripts/**"
      - ".github/workflows/shell-tests.yml"
  workflow_dispatch: {}

concurrency:
  group: shell-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-tests:
    # Security (D-08): the self-hosted runner sits on the PROD host, so a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (single
    # runner churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, oci-vm]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run shell test gate
        run: bash scripts/test/run-shell-tests.sh
