name: Shell tests (deploy/alignment scripts)

# D-19 — regression gate for scripts/ + db/scripts/ shell automation:
# bash -n on every script, shellcheck severity=error (installed on the runner),
# and fixture tests for the env-key-merge core + align-clones auto-deploy regex.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "db/scripts/**"
      - ".github/workflows/shell-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "db/scripts/**"
      - ".github/workflows/shell-tests.yml"
  workflow_dispatch: {}

permissions:
  # CodeQL actions/missing-workflow-permissions: il token di corsa non deve poter
  # scrivere. Questi workflow fanno solo checkout + verifica (upload-artifact usa il
  # token di runtime, non GITHUB_TOKEN), quindi la sola lettura basta.
  contents: read
concurrency:
  group: shell-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconda passata = doppione? Se l'albero e' gia' verde nella PR, su main i job si saltano
  # (scripts/ci/tree-gia-verificato.sh). Ogni dubbio: la CI gira.
  tree:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tree-gia-verificato.yml
    with:
      workflow-file: shell-tests.yml
  shell-tests:
    needs: tree
    # Security (D-08): the self-hosted runner sits on the PROD host, so a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (single
    # runner churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ !cancelled() && needs.tree.outputs.skip != 'true' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major')) }}
    runs-on: [self-hosted, off-prod]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # I runner off-prod non hanno shellcheck di sistema e senza la sezione B del gate si salterebbe.
      # Si scarica la stessa versione della VM (0.9.0), fissata per impronta SHA-256.
      - name: shellcheck 0.9.0 (fissato per impronta)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then shellcheck --version | sed -n 2p; exit 0; fi
          d="$RUNNER_TEMP/shellcheck"; mkdir -p "$d"
          curl -sSLf -o "$d/sc.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz
          echo "700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f  $d/sc.tar.xz" | sha256sum -c -
          tar -xJf "$d/sc.tar.xz" -C "$d" --strip-components=1 shellcheck-v0.9.0/shellcheck
          echo "$d" >> "$GITHUB_PATH"

      # Alcuni casi chiamano `python` e alcuni strumenti importano `yaml` (zp_review.py). Sui PC
      # Linux c'e' solo `python3`, e sul Debian 13 (mod-hpz420workstation) manca pyyaml: li'
      # zp-review-tests dava «3 passati, 17 falliti» (misurato il 20/11: «serve pyyaml»), mentre
      # sulla VM e sul linux-pc passava. Se l'interprete di sistema non ha yaml, la corsa si fa un
      # ambiente suo con pyyaml fissato; in ogni caso `python` e `python3` puntano allo stesso.
      - name: python e pyyaml della corsa
        run: |
          # Il venv va in PATH con la sua cartella bin: un collegamento a bin/python3 messo altrove
          # non trova pyvenv.cfg e torna l'interprete di sistema, senza yaml (visto il 20/11).
          if python3 -c 'import yaml' 2>/dev/null; then
            d="$RUNNER_TEMP/pybin"; mkdir -p "$d"
            command -v python >/dev/null 2>&1 || ln -sf "$(command -v python3)" "$d/python"
          else
            python3 -m venv "$RUNNER_TEMP/pyenv"
            "$RUNNER_TEMP/pyenv/bin/pip" install --quiet --disable-pip-version-check 'pyyaml==6.0.2'
            d="$RUNNER_TEMP/pyenv/bin"
          fi
          echo "$d" >> "$GITHUB_PATH"
          PATH="$d:$PATH" python -c 'import sys, yaml; print(sys.version.split()[0], "pyyaml", yaml.__version__)'
          PATH="$d:$PATH" python3 -c 'import yaml'

      - name: Run shell test gate
        run: bash scripts/test/run-shell-tests.sh
