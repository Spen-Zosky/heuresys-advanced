name: Deploy brand showcase to GitHub Pages

# Triggers:
# - push to main when showcase-related sources change
# - manual via workflow_dispatch
on:
  push:
    branches: [main]
    paths:
      - "apps/web/src/app/showcase/**"
      - "apps/web/src/lib/theme/**"
      - "apps/web/src/components/**"
      - "apps/web/src/app/globals.css"
      - "apps/web/src/app/layout.tsx"
      - "apps/showcase/**"
      - "scripts/sync-showcase.sh"
      - ".github/workflows/showcase.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: showcase-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # @heuresys/ui is npm-published (post-X18 migration): the root package.json
      # declares it as a normal semver dep (`"@heuresys/ui": "^0.1.x"`) resolved by
      # pnpm from the registry — no sister-repo checkout or local `link:` is needed.
      - name: Checkout heuresys-advanced
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: heuresys-advanced
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # 22, not 20: a transitive dep (camera-controls@3.1.2 via three.js in
          # @heuresys/ui) requires Node >=22, so `pnpm install --frozen-lockfile`
          # fails with ERR_PNPM_UNSUPPORTED_ENGINE on 20. Matches the 6 self-hosted
          # workflows. (Broke 2026-05-24 when the dep bumped its engines field.)
          node-version: "22"
          cache: pnpm
          cache-dependency-path: heuresys-advanced/pnpm-lock.yaml

      - name: Install heuresys-advanced
        working-directory: heuresys-advanced
        run: pnpm install --frozen-lockfile

      - name: Build static showcase
        working-directory: heuresys-advanced
        run: pnpm --filter @heuresys/showcase build:static

      - name: Verify output
        run: |
          ls heuresys-advanced/apps/showcase/out
          test -f heuresys-advanced/apps/showcase/out/showcase/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./heuresys-advanced/apps/showcase/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: |
            chore(pages): deploy brand showcase

            Source: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_id }}
