name: State lint (handoff/SoT coherence)

# P6 (design 2026-06-20 §11.6) — second gate for the handoff/SoT system: the same
# handoff_lint.py the close-flow runs locally also runs in CI, so a hand-edit to the
# state/backlog/debt files OUTSIDE the handoff (another session touching them without
# closing) is caught too. 10 checks: D1-D4 drift/freshness · S1-S2 · H1-H2 · A1-A2.

on:
  push:
    branches: [main]
    paths:
      - ".handoff/**"
      - "docs/kb/SOT_STATE.md"
      - "docs/kb/SOT_BACKLOG.md"
      - "docs/kb/DEBT_REGISTER.md"
      - "docs/kb/tools/handoff_lint.py"
      - ".programmi/**"
      - "docs/kb/tools/programmi.py"
      - ".github/workflows/state-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - ".handoff/**"
      - "docs/kb/SOT_STATE.md"
      - "docs/kb/SOT_BACKLOG.md"
      - "docs/kb/DEBT_REGISTER.md"
      - "docs/kb/tools/handoff_lint.py"
      - ".programmi/**"
      - "docs/kb/tools/programmi.py"
      - ".github/workflows/state-lint.yml"
  # Giro giornaliero (2026-11-20): su main state-lint gira solo quando si toccano i file di stato,
  # e cosi' e' rimasto rosso dal 5 al 20/11 senza che nessuno lo vedesse (SOT_STATE indietro di 31
  # migrazioni, un modulo senza test). Ogni mattina alle 05:40 UTC gira su main; se e' rosso, il job
  # `avviso` apre (o aggiorna) un'issue con l'etichetta `state-lint-rosso`.
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch: {}

permissions:
  # CodeQL actions/missing-workflow-permissions: il token di corsa non deve poter
  # scrivere. Questi workflow fanno solo checkout + verifica (upload-artifact usa il
  # token di runtime, non GITHUB_TOKEN), quindi la sola lettura basta.
  contents: read
concurrency:
  group: state-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state-lint:
    # Security (D-08): the self-hosted runner sits on the PROD host — a fork PR must NEVER
    # run on it. Same-repo PRs (Dependabot lives in this repo) + push/dispatch only; skip
    # Dependabot defer-major PRs (single-runner churn, D-09). Push events have no PR context.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, leggero]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run handoff lint (blocking gate)
        # The runner VM has the local DB, but the lint is repo-only (no heavy psql checks);
        # default mode is blocking (exit 1 on any FAIL).
        run: python3 docs/kb/tools/handoff_lint.py

      # S1030 (Z-125). Prima girava solo a mano, quindi non girava. Due passaggi: il
      # self-test verifica lo STRUMENTO sui casi che deve saper distinguere (furto di
      # prefisso, commenti, file vuoti), poi il censimento verifica il REPO. Uno strumento
      # di copertura che non controlla se stesso e' una dichiarazione, non una misura.
      # #249 F3 (S1091). Il cancello `programmi.py --verifica` esisteva, funzionava ed
      # usciva 1 — e NESSUNO lo interrogava: ne' il boot, ne' la chiusura, ne' la CI. Una
      # deriva che nessuno misura si accumula: era arrivata a 29 difetti su 12 piani, e
      # in S1090 ha fermato una chiusura per pura coincidenza. Qui e' inaggirabile, anche
      # per chi committa da un'altra interfaccia. Il self-test viene prima per la stessa
      # ragione dei due passi qui sotto: uno strumento che non prova se stesso e' una
      # dichiarazione, non una misura.
      - name: Piani multi-sessione — self-test dello strumento
        run: python3 docs/kb/tools/programmi.py --selftest

      - name: Piani multi-sessione — integrita' della contabilita' (blocking gate)
        run: python3 docs/kb/tools/programmi.py --verifica

      - name: Module/test coverage census — self-test
        run: python3 docs/kb/tools/check_module_test_coverage.py --self-test

      - name: Module/test coverage census — repo
        run: python3 docs/kb/tools/check_module_test_coverage.py

  avviso:
    # Solo per il giro giornaliero o un lancio a mano, e solo se state-lint e' rosso: un'issue
    # sola con l'etichetta `state-lint-rosso`, a cui si aggiunge un commento a ogni giro rosso.
    needs: state-lint
    if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, leggero]
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Apri o aggiorna l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Solo `gh api`: sul linux-pc c'e' gh 2.4, che non ha `gh label` ne' `gh issue --json`.
        run: |
          gh api -X POST "repos/$GH_REPO/labels" -f name=state-lint-rosso -f color=B60205 >/dev/null 2>&1 || true
          n="$(gh api "repos/$GH_REPO/issues?state=open&labels=state-lint-rosso&per_page=1" -q '.[0].number // empty')"
          testo="state-lint e' rosso su main ($(date -u +%Y-%m-%d)). Corsa: $CORSA"
          if [ -n "$n" ]; then
            gh api -X POST "repos/$GH_REPO/issues/$n/comments" -f body="$testo" >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues" -f title="state-lint rosso su main" -f body="$testo" -f "labels[]=state-lint-rosso" >/dev/null
          fi
