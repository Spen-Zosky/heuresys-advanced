name: Test (api integration)

# S935 phase F — CI gate #4: 41 integration tests via vitest on apps/api,
# hitting the live OCI PostgreSQL (localhost:5432 from the runner's POV,
# since the OCI VM is the runner host itself — no SSH tunnel needed in CI).
#
# The DB credentials come from runner-level env vars (set in systemd unit
# EnvironmentFile=/etc/heuresys-runner.env per docs/ci/self-hosted-runners-setup.md §4).
# Never expose secrets in workflow YAML (R11).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "cowork_reserved/**"
      - "cowork_code_exchange/**"
      - ".handoff/**"
      - "qa_artifacts/**"
      - "sessioni/**"
      - "apps/web/**"
      - "apps/showcase/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "db/**"
  workflow_dispatch: {}

concurrency:
  group: test-integration-${{ github.ref }}
  cancel-in-progress: false  # do NOT cancel running test suites mid-flight

jobs:
  test-integration:
    # Security (D-08): the self-hosted runner sits on the PROD host, so a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (single
    # runner churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, oci-vm]
    timeout-minutes: 15
    env:
      # POSTGRES_* + JWT_PRIVATE_KEY/JWT_PUBLIC_KEY + COOKIE_SECRET +
      # MFA_ENCRYPTION_KEY come from runner EnvironmentFile, not workflow.
      NODE_ENV: test
      LOG_LEVEL: warn
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify DB connectivity
        run: |
          psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DATABASE -c "SELECT 1" || \
            { echo "DB connectivity failed"; exit 1; }

      - name: Run vitest integration suite
        working-directory: apps/api
        run: pnpm exec vitest run --reporter=verbose --no-coverage

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-failures-${{ github.run_id }}
          path: apps/api/.vitest-cache/
          retention-days: 7
