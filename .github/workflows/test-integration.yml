name: Test (api integration)

# S935 phase F — CI gate #4: integration tests via vitest on apps/api.
# D-08 F5: runs on the OFF-PROD runner (linux-pc, the x86_64 PROD twin) against
# the twin's LOCAL PostgreSQL (heuresys_ci) — the OCI PROD host is no longer in
# the CI path at all (no SSH tunnel needed: localhost:5432 is the twin's own PG).
#
# The DB credentials come from runner-level env vars (set in systemd unit
# EnvironmentFile=/etc/heuresys-runner.env per docs/ci/self-hosted-runners-setup.md §4/§10).
# Never expose secrets in workflow YAML (R11).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "cowork_reserved/**"
      - "cowork_code_exchange/**"
      - ".handoff/**"
      - "qa_artifacts/**"
      - "sessioni/**"
      - "apps/web/**"
      - "apps/showcase/**"
      # Derivato dall'atlante (build_origine_moduli.py): lo rigenera da solo il timer, e il suo
      # commit non cambia il comportamento verificato dal codice che lo ha prodotto.
      - "apps/api/src/lib/origine/moduli.generated.ts"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "db/**"
      - "!apps/api/src/lib/origine/moduli.generated.ts"
  workflow_dispatch: {}

permissions:
  # CodeQL actions/missing-workflow-permissions: il token di corsa non deve poter
  # scrivere. Questi workflow fanno solo checkout + verifica (upload-artifact usa il
  # token di runtime, non GITHUB_TOKEN), quindi la sola lettura basta.
  contents: read
concurrency:
  group: test-integration-${{ github.ref }}
  # Sulle PR una corsa superata da un push più nuovo si annulla: il suo esito non serve più e tiene
  # occupato l'unico runner off-prod (misura 15-18/11: 15 corse già superate prima di partire, 202 min
  # di runner, attese medie di 36-138 min per le altre). Dal 18/11 ogni corsa ha il suo database
  # usa-e-getta (db/scripts/ci-db-usa-e-getta.sh, rimosso con `if: always()` anche sull'annullamento,
  # e spazzato dopo 12 ore se la corsa è uccisa), quindi interrompere a metà non sporca heuresys_ci.
  # Su main resta false: ogni commit di main ha il suo esito, che il rilascio legge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Seconda passata = doppione? Se l'albero e' gia' verde nella PR, su main i job si saltano
  # (scripts/ci/tree-gia-verificato.sh). Ogni dubbio: la CI gira.
  tree:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tree-gia-verificato.yml
    with:
      workflow-file: test-integration.yml
  # 2026-11-22: la suite si divide in due metà (vitest --shard) che girano insieme se ci sono due runner
  # pesanti liberi; ognuna ha il suo database usa-e-getta. Il job `test-integration` in fondo
  # mantiene il nome che i controlli richiesti e il cancello del rilascio conoscono.
  test-integration-meta:
    name: test-integration-meta (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    needs: tree
    # Security (D-08): self-hosted runner (off-prod twin on the LAN) — a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (runner
    # churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ !cancelled() && needs.tree.outputs.skip != 'true' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major')) }}
    runs-on: [self-hosted, off-prod]
    # 35min (raised from 25, S1115): the suite has grown from 153 to 292 files since
    # S1023's 13-14min measurement — 5 PASSING runs on 2026-09-26 measured 21-23min
    # job time (checkout→vitest), living 2-4min under the old 25min ceiling. One more
    # test file (Z-123) tipped it over: 6 CONSECUTIVE runs killed at exactly ~25m20s,
    # "Run vitest integration suite" never finishing — a real budget problem, not the
    # home-network flakiness that looked like the cause at first (ruled out: the same
    # suite ran clean end-to-end in 20m24s directly on the twin, network notwithstanding).
    # 35min gives the current ~21-23min job a real margin instead of living at the edge.
    # 2026-11-13: la suite e' cresciuta a 325 file e sul PC di CI la corsa supera i 35 min (1630 prove verdi, poi
    # annullata dal tetto, due volte di fila su #242 e prima su main). Tetto a 55 min, stesso criterio del 35 di a72f3049.
    timeout-minutes: 55
    env:
      # POSTGRES_* (except the DB name) + JWT_PRIVATE_KEY/JWT_PUBLIC_KEY +
      # COOKIE_SECRET + MFA_ENCRYPTION_KEY come from runner EnvironmentFile.
      # D-08: CI runs against the ISOLATED database heuresys_ci, NEVER PROD
      # (heuresys_advanced). This job-level env overrides the runner EnvironmentFile,
      # so vitest (env.ts -> client.ts) and every psql step point at heuresys_ci.
      # heuresys_ci is provisioned by db/scripts/setup-ci-database.sh (clone of PROD).
      POSTGRES_DB: heuresys_ci
      POSTGRES_DATABASE: heuresys_ci
      NODE_ENV: test
      LOG_LEVEL: warn
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # Ogni corsa ha il suo database: una copia usa-e-getta del modello heuresys_ci, creata qui e
      # tolta alla fine (db/scripts/ci-db-usa-e-getta.sh, «Ricostruisci e isola», Enzo 2026-11-18).
      # Da qui in poi POSTGRES_DB e POSTGRES_DATABASE puntano alla copia; il passo dopo lo verifica.
      - name: Database usa-e-getta della corsa
        run: bash db/scripts/ci-db-usa-e-getta.sh crea "integrazione${{ matrix.shard }}"

      - name: I passi usano il database della corsa
        run: bash db/scripts/ci-db-usa-e-getta.sh controlla

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
          # Una cartella per ISTANZA di runner (vedi lint.yml): evita lo scontro dello store fra due runner sulla stessa macchina.
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      # The unit layer lives in a SEPARATE vitest config, excluded from the
      # integration one — so the `vitest run` below never executed it and until
      # S1029 the unit tests were dead weight in CI. Placed here because it needs
      # no database: a pure-logic regression surfaces in seconds, before the four
      # DB setup steps and the ~14min suite. `pnpm test:unit` (not an inlined
      # vitest invocation) so the command has ONE definition, in package.json.
      - name: Run vitest unit suite (no DB)
        working-directory: apps/api
        run: pnpm test:unit

      - name: Verify DB connectivity
        run: |
          psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DATABASE -c "SELECT 1" || \
            { echo "DB connectivity failed"; exit 1; }

      # heuresys_ci is a PROD clone frozen at provisioning time: without this
      # step every migration born after the clone is invisible to CI (S1026:
      # 000199-000205 missing → RBAC-audience tests red across the suite).
      # The full set is idempotent + twice-run proven, so re-running is free.
      - name: Apply migrations (idempotent, brings the clone to HEAD)
        run: |
          # migrate.sh insists on an env FILE (arg 1); synthesize it from the
          # job env (runner EnvironmentFile + the heuresys_ci override above)
          # so the script cannot accidentally source a PROD-pointing .env.
          printf 'POSTGRES_HOST=%s\nPOSTGRES_PORT=%s\nPOSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\n' \
            "${POSTGRES_HOST:-localhost}" "${POSTGRES_PORT:-5432}" "$POSTGRES_DB" "$POSTGRES_USER" "$POSTGRES_PASSWORD" > /tmp/ci-migrate.env
          bash db/scripts/migrate.sh /tmp/ci-migrate.env
          rm -f /tmp/ci-migrate.env

      # S1027 (same class as the smoke fix): persona AUTH lives outside the
      # migrations — a persona added after the clone (S1026 custodian) has no
      # credential/TOTP factor on heuresys_ci and every loginRaw for it 401s.
      # Idempotent, login-only; TEST_ADMIN_PASSWORD from the runner env.
      - name: Seed test personas (idempotent, login-only)
        run: pnpm db:seed-test-admin

      # Mandato K, R-3 (S1107, 2026-09-19): le identita' di collaudo
      # (platform-operator@/sales@/dpo@/security-admin@collaudo.invalid, usate dai
      # test di R-9/R-7/R-2) non erano mai state provisionate su heuresys_ci — solo
      # sulla VM/gemello a mano da ogni sessione. Le tre suite fallivano con login
      # 401 (misurato: run 35413279596). COLLAUDO_ACCESS_KEY_B64 viene dal drop-in
      # systemd del runner (chiave dedicata a CI, isolata da quella di produzione).
      - name: Seed collaudo-access identities (idempotent)
        run: pnpm db:provision-collaudo

      # S1027: the occupation axis (mig 000206) ships its dataset as VERSIONED
      # CSVs + an idempotent fail-loud loader (db/data/occupations/) — unlike
      # the gitignored ESCO dump, heuresys_ci can carry the real catalog, so
      # the occupation tests run full instead of failing on an empty clone.
      - name: Load occupation-classifications dataset (idempotent)
        run: |
          psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DATABASE \
            -v ON_ERROR_STOP=1 -f db/scripts/populate-occupation-classifications.sql

      - name: Run vitest integration suite
        working-directory: apps/api
        run: pnpm exec vitest run --reporter=verbose --no-coverage --shard=${{ matrix.shard }}/2

      # Il diario del cancello dell'agente nel database (#253, 000452, 000482). Gira qui, e non
      # nel job di lint, perche' qui il database e' heuresys_ci e la catena e' gia' applicata:
      # nel lint il runner porta il POSTGRES_DB della produzione (D-08).
      - name: Run agent-gateway diary test (heuresys_ci)
        working-directory: apps/agent-gateway
        run: pnpm exec vitest run test/diario-nel-database.integration.test.ts --reporter=verbose

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-failures-${{ github.run_id }}-${{ matrix.shard }}
          path: apps/api/.vitest-cache/
          retention-days: 7

      - name: Togli il database della corsa
        if: always()
        run: bash db/scripts/ci-db-usa-e-getta.sh rimuovi

  # Riassunto con il nome di sempre: verde solo se tutte e due le metà sono verdi (o saltate perche'
  # l'albero era gia' verificato). Gira sulla VM, e' un controllo di una riga.
  test-integration:
    needs: [tree, test-integration-meta]
    if: ${{ always() }}
    runs-on: [self-hosted, oci-vm]
    timeout-minutes: 2
    steps:
      - name: Esito delle due metà
        env:
          ESITO: ${{ needs.test-integration-meta.result }}
          SALTA: ${{ needs.tree.outputs.skip }}
        run: |
          echo "metà: $ESITO (albero già verificato: $SALTA)"
          case "$ESITO" in success|skipped) ;; *) exit 1 ;; esac
