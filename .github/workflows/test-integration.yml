name: Test (api integration)

# S935 phase F — CI gate #4: integration tests via vitest on apps/api.
# D-08 F5: runs on the OFF-PROD runner (linux-pc, the x86_64 PROD twin) against
# the twin's LOCAL PostgreSQL (heuresys_ci) — the OCI PROD host is no longer in
# the CI path at all (no SSH tunnel needed: localhost:5432 is the twin's own PG).
#
# The DB credentials come from runner-level env vars (set in systemd unit
# EnvironmentFile=/etc/heuresys-runner.env per docs/ci/self-hosted-runners-setup.md §4/§10).
# Never expose secrets in workflow YAML (R11).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "cowork_reserved/**"
      - "cowork_code_exchange/**"
      - ".handoff/**"
      - "qa_artifacts/**"
      - "sessioni/**"
      - "apps/web/**"
      - "apps/showcase/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "db/**"
  workflow_dispatch: {}

concurrency:
  group: test-integration-${{ github.ref }}
  cancel-in-progress: false  # do NOT cancel running test suites mid-flight

jobs:
  test-integration:
    # Security (D-08): self-hosted runner (off-prod twin on the LAN) — a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (runner
    # churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, off-prod]
    # 25min: the full vitest suite takes ~13-14min on the off-prod twin (2-core
    # x86) + ~2-4min setup/install — the old 15min budget killed a PASSING run
    # at the post-steps (S1023, reported as "cancelled" by GitHub).
    timeout-minutes: 25
    env:
      # POSTGRES_* (except the DB name) + JWT_PRIVATE_KEY/JWT_PUBLIC_KEY +
      # COOKIE_SECRET + MFA_ENCRYPTION_KEY come from runner EnvironmentFile.
      # D-08: CI runs against the ISOLATED database heuresys_ci, NEVER PROD
      # (heuresys_advanced). This job-level env overrides the runner EnvironmentFile,
      # so vitest (env.ts -> client.ts) and every psql step point at heuresys_ci.
      # heuresys_ci is provisioned by db/scripts/setup-ci-database.sh (clone of PROD).
      POSTGRES_DB: heuresys_ci
      POSTGRES_DATABASE: heuresys_ci
      NODE_ENV: test
      LOG_LEVEL: warn
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify DB connectivity
        run: |
          psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DATABASE -c "SELECT 1" || \
            { echo "DB connectivity failed"; exit 1; }

      # heuresys_ci is a PROD clone frozen at provisioning time: without this
      # step every migration born after the clone is invisible to CI (S1026:
      # 000199-000205 missing → RBAC-audience tests red across the suite).
      # The full set is idempotent + twice-run proven, so re-running is free.
      - name: Apply migrations (idempotent, brings the clone to HEAD)
        run: |
          # migrate.sh insists on an env FILE (arg 1); synthesize it from the
          # job env (runner EnvironmentFile + the heuresys_ci override above)
          # so the script cannot accidentally source a PROD-pointing .env.
          printf 'POSTGRES_HOST=%s\nPOSTGRES_PORT=%s\nPOSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\n' \
            "${POSTGRES_HOST:-localhost}" "${POSTGRES_PORT:-5432}" "$POSTGRES_DB" "$POSTGRES_USER" "$POSTGRES_PASSWORD" > /tmp/ci-migrate.env
          bash db/scripts/migrate.sh /tmp/ci-migrate.env
          rm -f /tmp/ci-migrate.env

      # S1027 (same class as the smoke fix): persona AUTH lives outside the
      # migrations — a persona added after the clone (S1026 custodian) has no
      # credential/TOTP factor on heuresys_ci and every loginRaw for it 401s.
      # Idempotent, login-only; TEST_ADMIN_PASSWORD from the runner env.
      - name: Seed test personas (idempotent, login-only)
        run: pnpm db:seed-test-admin

      # S1027: the occupation axis (mig 000206) ships its dataset as VERSIONED
      # CSVs + an idempotent fail-loud loader (db/data/occupations/) — unlike
      # the gitignored ESCO dump, heuresys_ci can carry the real catalog, so
      # the occupation tests run full instead of failing on an empty clone.
      - name: Load occupation-classifications dataset (idempotent)
        run: |
          psql -h localhost -p 5432 -U $POSTGRES_USER -d $POSTGRES_DATABASE \
            -v ON_ERROR_STOP=1 -f db/scripts/populate-occupation-classifications.sql

      - name: Run vitest integration suite
        working-directory: apps/api
        run: pnpm exec vitest run --reporter=verbose --no-coverage

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-failures-${{ github.run_id }}
          path: apps/api/.vitest-cache/
          retention-days: 7
