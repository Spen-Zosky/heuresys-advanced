name: Typecheck (all workspaces)

# S935 phase F — CI gate #1: TypeScript strict-mode pass for all 3 workspaces
# (api, web, showcase, shared). Runs on the OCI VM self-hosted runner because
# the pnpm node_modules graph is symlink-heavy (~3GB) and re-install on a
# fresh GitHub-hosted runner per push would take 3-5min; on the persistent
# self-hosted runner with pnpm cache warm, this completes in <30s.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "cowork_reserved/**"
      - "cowork_code_exchange/**"
      - ".handoff/**"
      - "qa_artifacts/**"
      - "sessioni/**"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    # Security (D-08): the self-hosted runner sits on the PROD host, so a fork PR
    # must NEVER execute on it. Run only for push/workflow_dispatch or same-repo
    # PRs (Dependabot branches live in this repo); fork PRs are skipped before any
    # checkout reaches the runner. Plus: skip Dependabot defer-major PRs (single
    # runner churn — DEBT_REGISTER D-09). Push events have no PR context → run.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.pull_request.labels.*.name, 'defer-major') }}
    runs-on: [self-hosted, oci-vm]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.0

      # Note: on self-hosted runner, node 22.x is preinstalled via systemd unit
      # config (see docs/ci/self-hosted-runners-setup.md §3). actions/setup-node
      # is used only to enable pnpm store caching path resolution.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      # ⛔ NIENTE `cache: pnpm` QUI — misurato il 2026-09-08, e toglierlo e' la correzione.
      # Su questo runner `[self-hosted, oci-vm]` la cache di setup-node ha raggiunto **4,28 GB**,
      # e salvarla costa piu' del lavoro che il job fa: misurato sul log della PR #84,
      #   04:52:50 -> 04:55:42  tutti gli step VERDI (2m52s di lavoro utile)
      #   04:55:42              parte `tar --use-compress-program zstdmt`
      #   05:02:50              ##[error]The operation was canceled  (7m08s dentro il tar)
      # e sul job gemello l'upload e' stato ucciso al **98,4% di 4,28 GB**. Il `timeout-minutes: 10`
      # scadeva DOPO che il lavoro era finito: i controlli risultavano CANCELLED, che non e' un
      # fallimento — e' **assenza di misura**, cioe' la cosa peggiore, perche' somiglia a un verde.
      # E su un runner PERSISTENTE quella cache non serve: lo store di pnpm vive gia' sul disco
      # della macchina e sopravvive fra le corse. Serve sui runner effimeri, e infatti resta dov'e'
      # utile (`showcase.yml`, che gira su `ubuntu-latest`).
      # ⚠ Gli altri workflow self-hosted la tengono di proposito: `build-web`, `playwright-*` e
      # `test-integration` hanno timeout da 20 a 75 minuti e non hanno mai mostrato il difetto.
      # Toglierla anche a loro sarebbe allargare una correzione oltre la sua misura.

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck — @heuresys/shared
        run: pnpm --filter @heuresys/shared run typecheck

      - name: Typecheck — @heuresys/api (src)
        run: pnpm --filter @heuresys/api run typecheck

      - name: Typecheck — @heuresys/api (tests, separate tsconfig)
        run: pnpm --filter @heuresys/api run typecheck:test

      - name: Typecheck — @heuresys/web
        run: pnpm --filter @heuresys/web run typecheck

      - name: Typecheck — @heuresys/showcase
        run: pnpm --filter @heuresys/showcase run typecheck
        continue-on-error: false

      # S1029: agent-gateway era l'unico workspace fuori da questo gate — un errore di
      # tipo al suo interno non sarebbe stato visto da nessuna pipeline.
      - name: Typecheck — @heuresys/agent-gateway
        run: pnpm --filter @heuresys/agent-gateway run typecheck
