# ============================================================================
# heuresys-advanced — production nginx site config (VERSIONED MIRROR, docs/IaC).
# ============================================================================
# Live on VM oracle-vm-default: /etc/nginx/sites-enabled/www.heuresys.com.conf
# This is a versioned copy for config-as-code / reproducibility — `scripts/
# vm-deploy.sh` does NOT apply it (the deploy script never touches nginx). To
# change prod TLS/routing: edit on the VM, `sudo nginx -t`, `sudo systemctl
# reload nginx`, then sync the change back into this file. No secrets inline —
# the Certbot certificate KEYS live at the referenced /etc/letsencrypt paths,
# not in this file. Captured S964 (2026-06-05) from the live VM.
# ============================================================================

# Heuresys advanced (v5) — www + apex.
# Repointed from legacy heuresys-evo (:3012 web / :8012 api-gateway) to
# heuresys-advanced (:3013) on 2026-06-04 (S962). The advanced web (Next.js :3013)
# proxies /api internally to the API (:8013) via its own rewrite, so nginx needs a
# single location / → :3013 (NO separate /api/ block — that would hit the evo gateway).
# evo stays reachable on evo.heuresys.com (:3200), untouched. Cert unchanged (Certbot).

server {
    server_name www.heuresys.com heuresys.com;

    client_max_body_size 50M;

    # ACME challenge for Let's Encrypt renewal (must work over HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # heuresys-advanced web (Next.js) :3013 — serves / and /api/* (Next rewrites /api → :8013).
    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Block /metrics from public
    location /metrics {
        deny all;
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.heuresys.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.heuresys.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = heuresys.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.heuresys.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name www.heuresys.com heuresys.com;
    return 404; # managed by Certbot
}
