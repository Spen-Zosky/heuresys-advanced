# deploy/prometheus/prometheus.yml — D-09 F5: local collector on the OCI VM.
# Scrapes the API's gated /metrics (loopback-only endpoint, PROM_METRICS_ENABLED)
# every 30s. Prometheus itself listens on 127.0.0.1:9091 ONLY (unit flag;
# :9090 belongs to the VM's pre-existing legacy monitoring stack) —
# nothing is publicly exposed; consumption is via SSH tunnel when needed.
# Retention is set by the systemd unit flags (15d / 2GB — free-tier budget).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# S1029 (Z-015): prima di questa riga Prometheus raccoglieva metriche senza mai trarne
# una conclusione. Le regole vivono in alerts.yml, accanto a questo file: il percorso è
# relativo alla config, quindi funziona identico su VM e su linux-pc.
# Nessun `alerting:`/alertmanager per ora, ed è una scelta: senza un canale di consegna
# (SMTP bloccato su #8) un alertmanager sarebbe un'altra dashboard che nessuno apre. Gli
# alert sono interrogabili via /api/v1/rules e /api/v1/alerts; la consegna dei fallimenti
# schedulati passa dall'handler OnFailure al dashboard di sessione, che viene letto.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: heuresys-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8013"]
        labels:
          service: heuresys-advanced-api
          env: prod

  - job_name: prometheus-self
    static_configs:
      - targets: ["127.0.0.1:9091"]
