# D-08 F3 — cgroup resource slice for the self-hosted GitHub Actions runner
# on the OCI VM (the PROD host): a CI build/chromium/test suite must never
# starve the PROD services (api :8013, web :3013, PostgreSQL).
#
# VM = OCI A1 free tier, 4 OCPU / 24 GB: CI gets at most 3 cores + 12 GB,
# PROD always keeps ≥1 core + 12 GB.
#
# NOT auto-installed by vm-deploy.sh (its render loop covers *.service/*.timer
# only — this is runner infra, not app deploy). Install one-off on the VM:
#   U=actions.runner.Spen-Zosky-heuresys-advanced.oracle-vm-default-runner.service
#   sudo install -d "/etc/systemd/system/${U}.d"
#   sudo install -m 644 deploy/systemd/actions-runner-resource.dropin.conf \
#     "/etc/systemd/system/${U}.d/50-resource-slice.conf"
#   sudo systemctl daemon-reload && sudo systemctl restart "$U"
#
# The linux-pc off-prod runner does NOT use this file: its limits (10G/300%)
# are baked into the unit by scripts/provision-ci-runner-linuxpc.sh.
[Service]
MemoryMax=12G
CPUQuota=300%
