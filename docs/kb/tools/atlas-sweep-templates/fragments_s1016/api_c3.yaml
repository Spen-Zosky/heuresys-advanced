      - "CMS cap4: workflow draft->review->publish/unpublish + versioning con restore"
      - "file extra: media-routes.ts / media-service.ts / media-repository.ts / media-store.ts (ObjectStore seam)"
      - "media: @fastify/multipart scoped al plugin (1 file/request, hard byte cap MEDIA_MAX_BYTES); driver default LocalDiskStore su env.MEDIA_STORAGE_DIR; S3/MinIO previsto come config-swap MEDIA_STORAGE_DRIVER non ancora implementato (media-store.ts:3-6)"
      - "chiavi blob server-generated '<tenantId>/<mediaId>' + prefix-check anti path-traversal (media-store.ts:36-41)"
      - "visibilita tenant-only (mirror surveys/predictions); PLATFORM_ADMIN cross-tenant ma deve authorare dentro un tenant (service.ts:4,44)"
      - "permission dedicata content:publish per publish/unpublish (oltre a read/create/update/delete)"
