      - {method: GET, path: /succession-readiness, permission: 'insights:view', csrf: false, orgGate: service}
      - {method: POST, path: /succession-readiness/recompute, permission: 'insights:admin', csrf: true, orgGate: false}
      - {method: GET, path: /skill-gap, permission: 'insights:view', csrf: false, orgGate: service}
      - {method: POST, path: /skill-gap/recompute, permission: 'insights:admin', csrf: true, orgGate: false}
    tables:
      - sys.sys_users
      - sys.sys_user_position_assignments
      - sys.sys_attendance
      - sys.sys_user_kpi_evidence
      - sys.sys_engagement_survey_responses
      - sys.sys_position_compensation_profiles
      - sys.sys_compensation_bands
      - sys.sys_flight_risk_scores
      - sys.sys_positions
      - sys.sys_user_profile_embeddings
      - sys.sys_job_role_embeddings
      - sys.sys_succession_readiness_scores
      - sys.sys_skill_gap_scores
    schemas: [insights]
    tests:
      - insights.integration.test.ts
      - insights-p2.integration.test.ts
      - insights-recompute-cli.integration.test.ts
      - insights-scope.integration.test.ts
    notes:
      - "cap-3 data-mining: 3 slice di scoring (flight-risk / succession-readiness / skill-gap), pesi lineari deterministici + payload explainability"
      - "CLI file recompute-cli.ts: entrypoint systemd timer heuresys-advanced-insights.timer, in-process (no HTTP/auth), synthetic PLATFORM actor NIL-UUID"
      - "scope: PLATFORM (tutto) / TENANT / TEAM (posizioni owned dal manager) + ADR-0027 F3 userIdAllowList org-subtree; reads admin/manager-only, NO ESS self-view (D-6)"
      - "upsert delete-then-insert atomico in una CTE (D-18, tabella bounded 1 riga attiva/subject); read LIMIT 5000"
      - "slice B/C usano pgvector cosine (embedding <=> embedding) su user_profile/job_role embeddings"
      - "eng CTE guarda dual-shape response_answers jsonb (legacy array vs default object {}) con jsonb_typeof guard"
