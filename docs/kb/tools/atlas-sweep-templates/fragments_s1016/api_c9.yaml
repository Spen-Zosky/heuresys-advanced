# atlas fragment — batch C9 (users + 7 visualization-* modules)
# source: apps/api/src/app.ts:357,387-393 + per-module routes/repository/service (HEAD main, 2026-07-05)
modules:
  users:
    prefix: /v1/users
    endpoints:
      - {method: GET, path: /, permission: 'user:read', csrf: false, orgGate: service}
      - {method: GET, path: /:id, permission: 'user:read', csrf: false, orgGate: service}
      - {method: POST, path: /, permission: 'user:create', csrf: true, orgGate: false}
      - {method: PATCH, path: /:id, permission: 'user:update', csrf: true, orgGate: false}
      - {method: DELETE, path: /:id, permission: 'user:delete', csrf: true, orgGate: false}
      - {method: GET, path: /:id/roles, permission: 'user:read', csrf: false, orgGate: service}
      - {method: POST, path: /:id/roles, permission: 'role:assign', csrf: true, orgGate: false}
      - {method: DELETE, path: /:id/roles/:grantId, permission: 'role:assign', csrf: true, orgGate: false}
    tables: [sys.sys_users, sys.sys_user_auth_roles, sys.sys_auth_roles]
    schemas: [users]
    tests: [users.integration.test.ts]
    notes:
      - "visibilita 4-tier ADR-0027 F1: PLATFORM_ADMIN=all, HR-mandated (TENANT_ADMIN/HRMS_MANAGER)=tenant, chi ha report=subtree org TRANSITIVO, altrimenti self — delegata a lib/scope/resolver.ts (resolveOrgReadScope/canReadOrgTarget), che tocca tabelle org fuori dal repository del modulo"
      - "PATCH field-level restriction per non-privilegiati via NON_PRIVILEGED_UPDATABLE_FIELDS (@heuresys/shared); errore FIELD_NOT_ALLOWED"
      - "DELETE = soft delete (user_status -> DEACTIVATED); delete admin-only, nessun asse lo concede"
      - "getById risponde 404 (non 403) oltre boundary per anti-enumeration"
      - "role grants: revoca logica (revoked_at), grant unico attivo per (user,role,tenant)"
