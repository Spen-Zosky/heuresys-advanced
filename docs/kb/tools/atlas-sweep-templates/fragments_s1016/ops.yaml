systemd:  # unit note su oracle-vm-default; file template in deploy/systemd/ (@@VAR@@ renderizzati da vm-bootstrap)
  services_long_running:
    - {unit: heuresys-advanced-api.service, exec: "node dist/server.js (bundle tsup)", port: 8013}
    - {unit: heuresys-advanced-web.service, exec: "next start -H 0.0.0.0", port: 3013}
  oneshot_with_timer:  # tutti Persistent=true
    - {unit: heuresys-advanced-approvals-sla, cadence: "hourly *:20", exec: "pnpm approvals:sla", scope: "scan SLA/escalation approvazioni (3.3 slice-3b)"}
    - {unit: heuresys-advanced-backup, cadence: "daily 01:30", exec: "scripts/backup-db.sh", scope: "pg_dump -Fc + retention (R5)"}
    - {unit: heuresys-advanced-auth-housekeeping, cadence: "daily 02:00", exec: "scripts/auth-housekeeping.sh", scope: "prune refresh-token/login-event (QW-C2)"}
    - {unit: heuresys-advanced-insights, cadence: "daily 02:15", exec: "pnpm insights:recompute", scope: "flight-risk/succession/skill-gap (cap3)"}
    - {unit: heuresys-advanced-notifications-digest, cadence: "daily 02:45", exec: "pnpm notifications:digest", scope: "digest notifiche (3.4)"}
    - {unit: heuresys-advanced-scraping, cadence: "weekly Sun 03:30", exec: "pnpm reference-sync:run", scope: "refresh ESCO+ATECO da fonti ufficiali (cap5)"}
    - {unit: heuresys-advanced-dr-drill, cadence: "weekly Sun 04:00", exec: "scripts/dr-drill.sh", scope: "restore-verify backup, RPO/RTO (QW-C3)"}
    - {unit: heuresys-advanced-reindex, cadence: "weekly Sun 04:30", exec: "pnpm embeddings:backfill", scope: "reindex embeddings semantic-matching (R7)"}
  other_on_vm_not_in_repo:
    - "heuresys-{api-gateway,app,enrichment} — stack legacy heuresys-evo (unit non in questo repo)"
    - "GitHub Actions self-hosted runner (label oci-vm; env creds in /etc/heuresys-runner.env, docs/ci/self-hosted-runners-setup.md)"
  windows_scheduled_task: {name: HeuresysTunnel5433, trigger: At-Logon, exec: tunnel-keepalive.ps1, scope: "tunnel :5433->VM:5432 (ADR-0021)"}
