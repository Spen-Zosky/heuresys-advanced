# atlas fragment — frontend admin (apps/web, (authenticated) excl. me/)
# generated: 2026-07-05 | source sweep: 53 page.tsx + lib/api + components locali
# convenzione hooks: "inline-useQuery"/"inline-useMutation" = TanStack Query inline in page con apiFetch (pattern dominante, nessun layer hook per-modulo)
# convenzione ui: nomi = import diretti da @heuresys/ui; "local:X" = wrapper locale apps/web/src/components (mapping in components:)
meta:
  scope: apps/web/src/app/(authenticated)/ (route group non in URL), zona admin
  pages_count: 53
  i18n_namespaces: {admin: 30, hr: 11, analytics: 9, blueprints: 5}
