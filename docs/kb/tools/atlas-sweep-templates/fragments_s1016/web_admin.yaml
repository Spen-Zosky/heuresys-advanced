lib:
  lib/api/fetch.ts:
    exports: [apiFetch]
    notes: [wrapper unico HTTP dietro proxy Next /api (cookie same-origin), CSRF header auto su metodi non-GET da csrfStore, silent-refresh 401 single-flight + Web Locks cross-tab (D-26) via POST /v1/auth/refresh, errori tipizzati ApiError/SessionExpiredError/NetworkError, validazione Zod opzionale]
  lib/api/auth.ts:
    hooks:
      useCurrentUser: "GET /v1/auth/me"
      useCurrentUserPermissions: "GET /v1/me/permissions"
      useMyInterfaces: "GET /v1/me/interfaces"
      useMyPreferences: "GET /v1/me/preferences"
      useUpdateMyPreferences: "PATCH /v1/me/preferences"
      useLogin: "POST /v1/auth/login (3 stati: success | mfa_required | mfa_enrollment_required)"
      useLogout: "POST /v1/auth/logout"
  lib/api/observability.ts:
    hooks:
      useSystemHealth: "GET /v1/observability/system-health"
      useRolePermissions: "GET /v1/auth/role-permissions"
  lib/api/errors.ts: {exports: [ApiError, NetworkError, SessionExpiredError, isApiError]}
  lib/api/csrf-store.ts: {exports: [csrfStore], notes: [seed da login/refresh, unico punto CSRF]}
  lib/api/public-stats.ts: {notes: [zona public/landing, fuori scope admin]}
  lib/i18n.ts: {notes: [namespaces admin/hr/analytics/blueprints + common]}

