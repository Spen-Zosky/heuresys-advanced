    exports: [EChartsCard, MermaidDiagram]
    notes: [re-export dynamic ssr:false dei chart pesanti (echarts crasha il prerender server - CW-B59), subpath @heuresys/ui/charts per non trascinare il barrel ~1.68MB, resolver var(--x) -> colore concreto per canvas echarts (fix B-05), da importare SEMPRE da qui nelle pagine chart]
