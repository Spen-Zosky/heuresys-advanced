    ui_wrapped: [DataTableWithCrossHair, EmptyState, ErrorState, PageHeader, Badge, Button]
    notes: [state-machine loading/error/empty presentazionale - la page possiede la query, empty branch = empty-state reale (dottrina live-data), DataTablePanel = PageHeader + EntityTable - usato da ~15 list page, EntityTable standalone da ~12]
