patterns:
  - "tutte le pagine me sono client components ('use client') con useQuery+apiFetch diretto; nessun server component data-fetching"
  - "i18n: zona me = namespace 'ess'; public = landing/demo/investors; login = default namespace"
  - "empty-state reale su lista vuota ovunque (doctrine LIVE DATA E2E ONLY, no mock)"
  - "gating RBAC client assente by design: sidebar server-driven via GET /v1/me/interfaces (U2 S955, gating client rimosso); self-scope garantito server-side (I17)"
  - "perspective PET: filtro applicato nel layout/sidebar (useMyInterfaces raggruppa per PET), non nelle singole pagine"
