lib:
  apps/web/src/lib/api/auth.ts:
    hooks:
      useCurrentUser: GET /v1/auth/me
      useLogin: POST /v1/auth/login (seed csrfStore + invalida user)
      useLogout: POST /v1/auth/logout
      useMyInterfaces: GET /v1/me/interfaces (sidebar DB-driven, raggruppata per 3 prospettive PET)
      useMyPreferences: GET /v1/me/preferences
      useUpdateMyPreferences: PATCH /v1/me/preferences
  apps/web/src/lib/api/public-stats.ts:
    hooks:
      usePlatformStats: GET /api/v1/public/platform-stats (fetch raw, endpoint pubblico non autenticato)
  apps/web/src/lib/api/fetch.ts: "apiFetch<T> — wrapper fetch same-origin /api + CSRF + errori tipizzati (usato da tutte le pagine)"
  apps/web/src/lib/api/csrf-store.ts: csrfStore (double-submit token client-side)
  apps/web/src/lib/api/errors.ts: isApiError (discrimina code/status)
  apps/web/src/lib/landing.ts: landingForRoles (routing post-login per ruolo)
components:
  apps/web/src/components/data-table-panel.tsx: "DataTablePanel + EntityTable + DataColumn — pattern list-page canonico brand-fidelity (usato da documents/gaps/kpis/learning/positions/handbook; EntityTable standalone da certifications/catalogue/matching)"
  apps/web/src/components/status-pill.tsx: "StatusPill (tone) + StatusBadge (value->tone)"
  apps/web/src/components/profile-tabs.tsx: "ProfileTabs + ProfileTabDef — sub-tab IA con testId, usato da /me, /me/profile, /me/career"
  apps/web/src/components/lead-form.tsx: "LeadForm(source) -> POST /api/v1/leads (lead capture pubblico, no CSRF-session)"
  apps/web/src/app/(authenticated)/_charts-client.tsx: "EChartsCard — wrapper echarts client-only (usato da me/analytics, me/org-chart)"
