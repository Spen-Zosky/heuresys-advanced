middleware_proxy:
  middleware_ts: ASSENTE  # nessun middleware.ts in apps/web — protezione route interamente client-side (layout autenticato + hook) + enforcement RBAC lato API
  next_config: apps/web/next.config.js
  rewrite: "/api/:path* -> ${NEXT_PUBLIC_API_PROXY_BASE_URL|http://localhost:3001}/:path*"
  rationale: cookie HttpOnly SameSite=Lax same-origin + CSRF double-submit senza CORS preflight
  transpilePackages: ["@heuresys/ui", "@heuresys/shared"]
  optimizePackageImports: [lucide-react, "@heuresys/ui"]

