  apps/web/src/lib/api/fetch.ts:
    exports: [apiFetch, ApiFetchOptions, HttpMethod]
    hooks: []
    endpoints: [POST /v1/auth/refresh]  # interno al silent-refresh
    role: wrapper fetch unico dietro proxy /api — credentials include, x-csrf-token da csrfStore su mutazioni, silent refresh su 401 (single-flight + Web Lock hrx_refresh_rotation cross-tab, D-26), errori tipizzati, Zod opzionale su success body
  apps/web/src/lib/api/auth.ts:
    exports: [useCurrentUser, useCurrentUserPermissions, useMyInterfaces, useMyPreferences, useUpdateMyPreferences, useLogin, useLogout, AUTH_ME_QUERY_KEY, ME_PERMISSIONS_QUERY_KEY, ME_INTERFACES_QUERY_KEY, ME_PREFERENCES_QUERY_KEY]
    hooks: [useCurrentUser, useCurrentUserPermissions, useMyInterfaces, useMyPreferences, useUpdateMyPreferences, useLogin, useLogout]
    endpoints: [GET /v1/auth/me, GET /v1/me/permissions, GET /v1/me/interfaces, GET /v1/me/preferences, PATCH /v1/me/preferences, POST /v1/auth/login, POST /v1/auth/logout]
    role: hook TanStack Query auth+RBAC+PET-sidebar+preferenze; login gestisce 3 stati (success | mfa_required | mfa_enrollment_required) e semina csrfStore; useMyInterfaces = sidebar DB-driven server-gated (nessun filtering client)
  apps/web/src/lib/api/csrf-store.ts:
    exports: [csrfStore]
    hooks: []
    endpoints: []
    role: store CSRF a 3 livelli — in-memory + cookie leggibile hrx_csrf + BroadcastChannel hrx_csrf_rotation per sync cross-tab
  apps/web/src/lib/api/errors.ts:
    exports: [ApiError, SessionExpiredError, NetworkError, isApiError, ApiErrorBody]
    hooks: []
    endpoints: []
    role: classi errore tipizzate speculari a apps/api/src/errors (branch su error.code senza parsing stringhe)
  apps/web/src/lib/api/observability.ts:
    exports: [useSystemHealth, useRolePermissions, SYSTEM_HEALTH_QUERY_KEY, ROLE_PERMISSIONS_QUERY_KEY]
