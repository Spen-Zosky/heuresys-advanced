services:
  postgres:
    image: postgres:16
    container_name: company_hrms_bpm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_hrms_bpm}
      POSTGRES_USER: ${POSTGRES_USER:-company_hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-company_hrms_dev_password}
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    volumes:
      - company_hrms_bpm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-company_hrms} -d ${POSTGRES_DB:-company_hrms_bpm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  company_hrms_bpm_pgdata:
